<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detector de QR sospechosos</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
      line-height: 1.5;
    }
    main { max-width: 560px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    .ayuda { margin: 0 0 20px; color: #4b5563; }
    .tarjeta {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    label { display: block; font-weight: 600; margin-bottom: 8px; }
    input {
      width: 100%;
      font-size: 1rem;           /* 16px evita el zoom automático en iPhone */
      padding: 12px;
      border: 2px solid #d1d5db;
      border-radius: 8px;
    }
    input:focus { outline: none; border-color: #2563eb; }
    button {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
      background: #2563eb;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:active { background: #1d4ed8; }

    .separador {
      display: flex; align-items: center; gap: 10px;
      margin: 18px 0 12px; color: #6b7280; font-size: .9rem;
    }
    .separador::before, .separador::after {
      content: ""; flex: 1; height: 1px; background: #e5e7eb;
    }
    /* El botón de foto es un <label> que se ve como botón;
       el <input type="file"> real queda escondido. */
    .boton-foto {
      display: block;
      text-align: center;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: 600;
      color: #2563eb;
      background: #eff6ff;
      border: 2px dashed #93c5fd;
      border-radius: 8px;
      cursor: pointer;
      margin: 0;
    }
    .boton-foto:active { background: #dbeafe; }
    #foto { position: absolute; width: 1px; height: 1px; opacity: 0; }
    #foto:focus-visible + .boton-foto { outline: 3px solid #2563eb; }
    .pista { font-size: .85rem; color: #6b7280; margin: 8px 0 0; text-align: center; }
    .contenido-qr {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: .9rem; word-break: break-all; color: #4b5563;
    }

    #resultado { margin-top: 20px; }
    .caja { border-radius: 12px; padding: 18px; border-left: 6px solid; }
    .caja h2 { margin: 0 0 8px; font-size: 1.2rem; }
    .caja p { margin: 6px 0; }
    .caja ul { margin: 8px 0; padding-left: 20px; }
    .dominio {
      display: inline-block;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 1.05rem;
      background: rgba(255,255,255,.7);
      padding: 2px 8px;
      border-radius: 6px;
      word-break: break-all;
    }
    .riesgo       { background: #fef2f2; border-color: #dc2626; }
    .riesgo h2    { color: #b91c1c; }
    .sin-senales  { background: #f0fdf4; border-color: #16a34a; }
    .sin-senales h2 { color: #15803d; }
    .insuficiente { background: #f9fafb; border-color: #6b7280; }
    .insuficiente h2 { color: #374151; }
    .aviso { font-weight: 600; }
    footer { margin-top: 24px; font-size: .9rem; color: #6b7280; text-align: center; }
    footer a { color: #2563eb; }
  </style>
</head>
<body>
  <main>
    <h1>Detector de QR sospechosos</h1>
    <p class="ayuda">Sube una foto del código QR o pega su enlace. Lo revisamos sin abrirlo.</p>

    <form id="formulario" class="tarjeta">
      <label for="enlace">Enlace del código QR</label>
      <input id="enlace" type="text" inputmode="url" autocomplete="off"
             autocapitalize="off" spellcheck="false"
             placeholder="https://ejemplo.com/pago">
      <button type="submit">Revisar</button>

      <div class="separador">o</div>

      <!-- En el celular, este botón ofrece sacar una foto o elegir una de la galería -->
      <input id="foto" type="file" accept="image/*">
      <label for="foto" class="boton-foto">📷 Subir foto del QR</label>
      <p class="pista">En el computador también puedes pegar una captura con Ctrl + V.</p>
    </form>

    <!-- aria-live hace que los lectores de pantalla lean el resultado -->
    <section id="resultado" aria-live="polite"></section>

    <footer><a href="pruebas.html">Ver pruebas automáticas</a></footer>
  </main>

  <script src="reglas.js"></script>
  <script src="jsQR.js"></script>
  <script src="lector-qr.js"></script>
  <script>
    const formulario = document.getElementById("formulario");
    const campo = document.getElementById("enlace");
    const resultado = document.getElementById("resultado");
    const foto = document.getElementById("foto");

    // Crea un elemento HTML con texto. Usamos textContent (no innerHTML)
    // para que nada de lo que pegue la persona se ejecute como código.
    function crear(etiqueta, texto, clase) {
      const el = document.createElement(etiqueta);
      if (texto) el.textContent = texto;
      if (clase) el.className = clase;
      return el;
    }

    // Muestra el dominio como texto plano (nunca como enlace clicable).
    function lineaDominio(textoAntes, dominio) {
      const p = crear("p", textoAntes + " ");
      p.appendChild(crear("span", dominio, "dominio"));
      return p;
    }

    function mostrar(r) {
      resultado.innerHTML = ""; // borra el resultado anterior
      const caja = crear("div", null, "caja");
      const titulo = { riesgo: "⚠️ Señal de riesgo", sin: "✅ Sin señales", insuf: "❔ Información insuficiente" };

      if (r.estado === ESTADOS.RIESGO) {
        caja.classList.add("riesgo");
        caja.appendChild(crear("h2", titulo.riesgo));
        caja.appendChild(lineaDominio("Sitio:", r.dominio));
        const lista = crear("ul");
        r.motivos.forEach((m) => lista.appendChild(crear("li", m)));
        caja.appendChild(lista);
        caja.appendChild(crear("p", "Esto no confirma un fraude: revisa antes de abrir.", "aviso"));

      } else if (r.estado === ESTADOS.SIN_SENALES) {
        caja.classList.add("sin-senales");
        caja.appendChild(crear("h2", titulo.sin));
        caja.appendChild(lineaDominio("El enlace lleva a:", r.dominio));
        caja.appendChild(crear("p", "Confirma que este es el sitio que esperabas antes de abrirlo."));

      } else {
        caja.classList.add("insuficiente");
        caja.appendChild(crear("h2", titulo.insuf));
        caja.appendChild(crear("p", r.mensaje || "El texto no parece un enlace web válido. Revisa que lo hayas copiado completo."));
      }

      // Si vino de una foto, mostramos el texto completo que traía el QR.
      if (r.textoQR) {
        caja.appendChild(crear("p", "Contenido del QR:"));
        caja.appendChild(crear("p", r.textoQR, "contenido-qr"));
      }

      resultado.appendChild(caja);
    }

    formulario.addEventListener("submit", function (evento) {
      evento.preventDefault(); // evita que la página se recargue
      mostrar(analizarEnlace(campo.value));
    });

    // Revisa una imagen: muestra "Leyendo...", lee el QR y muestra el resultado.
    async function revisarImagen(imagen) {
      resultado.innerHTML = "";
      resultado.appendChild(crear("p", "Leyendo el código QR…", "pista"));
      const r = await revisarImagenQR(imagen);
      campo.value = r.textoQR || ""; // ponemos lo leído en el cuadro de texto
      mostrar(r);
    }

    // Cuando la persona elige o saca una foto.
    foto.addEventListener("change", function () {
      if (foto.files.length > 0) revisarImagen(foto.files[0]);
      foto.value = ""; // permite volver a elegir la misma foto
    });

    // Cuando la persona pega (Ctrl + V) una imagen en la página.
    document.addEventListener("paste", function (evento) {
      const items = evento.clipboardData ? evento.clipboardData.files : [];
      for (const archivo of items) {
        if (archivo.type.startsWith("image/")) {
          evento.preventDefault();
          revisarImagen(archivo);
          return;
        }
      }
      // Si no era una imagen, se pega el texto normalmente en el cuadro.
    });
  </script>
</body>
</html>
